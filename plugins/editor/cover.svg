<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" fill="none">
  <!-- ============================================================
       editor 封面 · 候选 A「代码的窗」      [skill: ui-ux-pro-max]
       理念：LinkDesk 编辑器 = Monaco 引擎装进「文件双击即开」的那扇窗。
       画一个正在工作的编辑器窗口——标签条、行号、括号对着色、
       光标行、缩略图、状态栏全部在场；窗后是暗色开发台面。
       资产独立 SVG：颜色自含（封面美术不受壳主题 token 约束）。
       ============================================================ -->
  <defs>
    <radialGradient id="edA_bg" cx="0.5" cy="0.42" r="0.9">
      <stop offset="0" stop-color="#151b2e"/>
      <stop offset="0.55" stop-color="#0d1220"/>
      <stop offset="1" stop-color="#070a13"/>
    </radialGradient>
    <radialGradient id="edA_glowTL" cx="0.16" cy="0.08" r="0.75">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="edA_glowBR" cx="0.94" cy="1.02" r="0.85">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edA_head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2133"/>
      <stop offset="1" stop-color="#171c2c"/>
    </linearGradient>
    <linearGradient id="edA_body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11141f"/>
      <stop offset="1" stop-color="#0d1019"/>
    </linearGradient>
    <linearGradient id="edA_row" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.045"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edA_status" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.015"/>
    </linearGradient>
    <filter id="edA_shadow" x="-30%" y="-40%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <pattern id="edA_grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 H 0 V 44" stroke="#ffffff" stroke-opacity="0.03"/>
    </pattern>
  </defs>

  <!-- 底：暗色开发台面（极简网格 + 左顶靛蓝 / 右底青环境光） -->
  <rect width="640" height="640" fill="url(#edA_bg)"/>
  <rect width="640" height="640" fill="url(#edA_glowTL)"/>
  <rect width="640" height="640" fill="url(#edA_glowBR)"/>
  <rect width="640" height="640" fill="url(#edA_grid)"/>

  <!-- 左下角浮标：editor 自己的 </> 标志（呼应 icon.svg），微弱 -->
  <g stroke="#a5b2d4" stroke-opacity="0.15" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 74 556 L 50 588 L 74 620"/>
    <path d="M 112 620 L 88 588 L 112 556"/>
    <path d="M 99 558 L 85 618"/>
  </g>

  <!-- 编辑器窗口：外阴影 + 本体 -->
  <rect x="44" y="104" width="552" height="428" rx="20" fill="#000" opacity="0.45" filter="url(#edA_shadow)"/>
  <rect x="44" y="104" width="552" height="428" rx="20" fill="#0e121d"/>
  <rect x="44" y="104" width="552" height="428" rx="20" stroke="#ffffff" stroke-opacity="0.10"/>
  <rect x="46.5" y="106.5" width="547" height="31" rx="15" fill="#ffffff" fill-opacity="0.04"/>

  <!-- 标题区：红绿灯 + 活跃标签 main.ts -->
  <circle cx="70" cy="123" r="5.5" fill="#ff5f57"/>
  <circle cx="87" cy="123" r="5.5" fill="#febc2e"/>
  <circle cx="104" cy="123" r="5.5" fill="#28c840"/>
  <g>
    <rect x="146" y="106" width="120" height="30" rx="8" fill="#171c2c"/>
    <path d="M 158 119.5 q 4.6 -6.5 9.2 0 q 4.6 6.5 9.2 0" stroke="#8bb6ff" stroke-width="1.7" fill="none" stroke-linecap="round"/>
    <text x="182" y="125" font-family="Consolas, 'JetBrains Mono', monospace" font-size="13" fill="#e3e9f7">main.ts</text>
    <line x1="146" y1="140" x2="266" y2="140" stroke="#61afef" stroke-width="2.2"/>
  </g>

  <!-- 编辑器身体 -->
  <rect x="44" y="144" width="552" height="388" fill="url(#edA_body)"/>
  <line x1="44" y1="144" x2="596" y2="144" stroke="#ffffff" stroke-opacity="0.05"/>

  <!-- 光标行（第 12 行空白尾行）高亮 -->
  <rect x="44" y="424" width="552" height="24" fill="url(#edA_row)"/>

  <!-- 行号：右对齐 -->
  <g font-family="Consolas, 'JetBrains Mono', monospace" font-size="13" fill="#3a4460" text-anchor="end">
    <text x="160" y="180">1</text>
    <text x="160" y="204">2</text>
    <text x="160" y="228">3</text>
    <text x="160" y="252">4</text>
    <text x="160" y="276">5</text>
    <text x="160" y="300">6</text>
    <text x="160" y="324">7</text>
    <text x="160" y="348">8</text>
    <text x="160" y="372">9</text>
    <text x="160" y="396">10</text>
    <text x="160" y="420">11</text>
    <text x="160" y="444" fill="#9aa6c8">12</text>
  </g>

  <!-- 代码（等宽流式着色；One-Dark 系 token 配色） -->
  <g font-family="Consolas, 'JetBrains Mono', monospace" font-size="15">
    <text x="172" y="180">
      <tspan fill="#c678dd">import</tspan>
      <tspan fill="#c8d0e0"> { </tspan>
      <tspan fill="#61afef">open</tspan>
      <tspan fill="#c8d0e0"> } </tspan>
      <tspan fill="#c678dd">from</tspan>
      <tspan fill="#c8d0e0"> </tspan>
      <tspan fill="#98c379">"@linkdesk/editor"</tspan>
      <tspan fill="#c8d0e0">;</tspan>
    </text>

    <text x="172" y="228">
      <tspan fill="#c678dd">export async function </tspan>
      <tspan fill="#61afef">open</tspan>
      <tspan fill="#c8d0e0">(</tspan>
      <tspan fill="#c8d0e0">file</tspan>
      <tspan fill="#c8d0e0">: </tspan>
      <tspan fill="#e5c07b">FileRef</tspan>
      <tspan fill="#c8d0e0">) {</tspan>
    </text>
    <text x="172" y="252">
      <tspan fill="#c8d0e0">  const editor = </tspan>
      <tspan fill="#c678dd">await</tspan>
      <tspan fill="#c8d0e0"> </tspan>
      <tspan fill="#61afef">openEditor</tspan>
      <tspan fill="#c8d0e0">(file);</tspan>
    </text>

    <text x="172" y="300">
      <tspan fill="#c8d0e0">  editor.</tspan>
      <tspan fill="#61afef">setLanguage</tspan>
      <tspan fill="#c8d0e0">(</tspan>
      <tspan fill="#61afef">detectLanguage</tspan>
      <tspan fill="#c8d0e0">(file));</tspan>
    </text>

    <text x="172" y="348">
      <tspan fill="#c8d0e0">  editor.</tspan>
      <tspan fill="#61afef">onDidChange</tspan>
      <tspan fill="#c8d0e0">((e) =&gt; </tspan>
      <tspan fill="#61afef">autosave</tspan>
      <tspan fill="#c8d0e0">(e));</tspan>
    </text>

    <text x="172" y="396">
      <tspan fill="#c8d0e0">  </tspan>
      <tspan fill="#c678dd">return</tspan>
      <tspan fill="#c8d0e0"> editor;</tspan>
    </text>
    <text x="172" y="420">
      <tspan fill="#c8d0e0">}</tspan>
    </text>
  </g>

  <!-- 光标：第 12 行空白尾行列 0，青色细线（cursorBlinking=blink） -->
  <line x1="172" y1="426" x2="172" y2="448" stroke="#22d3ee" stroke-width="2.4" stroke-linecap="round"/>

  <!-- 缩略图（minimap 呼应）：右缘淡编码 tick + 视口滑块 -->
  <g opacity="0.42">
    <rect x="566" y="156" width="3" height="3" rx="1" fill="#c678dd"/>
    <rect x="566" y="166" width="3" height="3" rx="1" fill="#98c379"/>
    <rect x="566" y="178" width="3" height="5" rx="1" fill="#61afef"/>
    <rect x="566" y="190" width="3" height="3" rx="1" fill="#e5c07b"/>
    <rect x="566" y="202" width="3" height="4" rx="1" fill="#c678dd"/>
    <rect x="566" y="214" width="3" height="3" rx="1" fill="#c8d0e0"/>
    <rect x="566" y="226" width="3" height="6" rx="1" fill="#61afef"/>
    <rect x="566" y="244" width="3" height="3" rx="1" fill="#98c379"/>
    <rect x="566" y="256" width="3" height="4" rx="1" fill="#e5c07b"/>
    <rect x="566" y="270" width="3" height="3" rx="1" fill="#c678dd"/>
    <rect x="566" y="284" width="3" height="5" rx="1" fill="#c8d0e0"/>
    <rect x="566" y="298" width="3" height="3" rx="1" fill="#98c379"/>
    <rect x="566" y="312" width="3" height="4" rx="1" fill="#61afef"/>
    <rect x="566" y="328" width="3" height="3" rx="1" fill="#e5c07b"/>
    <rect x="566" y="344" width="3" height="6" rx="1" fill="#c678dd"/>
    <rect x="566" y="366" width="3" height="3" rx="1" fill="#c8d0e0"/>
    <rect x="566" y="382" width="3" height="4" rx="1" fill="#98c379"/>
    <rect x="566" y="398" width="3" height="3" rx="1" fill="#61afef"/>
    <rect x="566" y="414" width="3" height="5" rx="1" fill="#e5c07b"/>
    <rect x="563" y="232" width="9" height="72" rx="4.5" fill="#ffffff" fill-opacity="0.10"/>
  </g>

  <!-- 状态栏 -->
  <rect x="44" y="488" width="552" height="44" fill="url(#edA_status)"/>
  <line x1="44" y1="488" x2="596" y2="488" stroke="#ffffff" stroke-opacity="0.07"/>
  <g font-family="Consolas, 'JetBrains Mono', monospace" font-size="12.5" fill="#5d6a8a">
    <text x="64" y="515">TypeScript</text>
    <text x="166" y="515">Spaces: 2</text>
    <text x="262" y="515">UTF-8</text>
    <text x="330" y="515">Ln 12, Col 1</text>
    <text x="508" y="515" fill="#98c379">autosave ✓</text>
  </g>
</svg>
