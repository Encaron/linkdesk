<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" fill="none">
  <!-- ============================================================
       python 封面「补全的窗」   [skill: ui-ux-pro-max · A 家族]
       理念：零界面语言插件 = 它的全部舞台就是你编辑 .py 的那一刻。
       画「正在写 Python 的窗」——Monaco 里一段带真实 token 着色的代码、
       行号、竖光标，右边浮起 pyright 智能补全浮层，末行一条类型诊断
       红色波浪，状态栏 pyright 已就绪。左下浮标 = python 双色 `>>>` 提示符。
       资产独立 SVG：颜色自含（封面美术不受壳主题 token 约束）。
       ============================================================ -->
  <defs>
    <radialGradient id="py_bg" cx="0.5" cy="0.42" r="0.9">
      <stop offset="0" stop-color="#141a29"/>
      <stop offset="0.55" stop-color="#0d111d"/>
      <stop offset="1" stop-color="#070a12"/>
    </radialGradient>
    <radialGradient id="py_glowTL" cx="0.15" cy="0.07" r="0.8">
      <stop offset="0" stop-color="#4f9cf6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#4f9cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="py_glowBR" cx="0.97" cy="1.05" r="0.85">
      <stop offset="0" stop-color="#FFD43B" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFD43B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="py_head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171d30"/>
      <stop offset="1" stop-color="#101524"/>
    </linearGradient>
    <linearGradient id="py_tabrow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1320"/>
      <stop offset="1" stop-color="#0c1019"/>
    </linearGradient>
    <linearGradient id="py_body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0f19"/>
      <stop offset="1" stop-color="#090c14"/>
    </linearGradient>
    <linearGradient id="py_badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3776AB"/>
      <stop offset="0.55" stop-color="#4B8BBE"/>
      <stop offset="0.9" stop-color="#FFD43B"/>
    </linearGradient>
    <linearGradient id="py_status" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f9cf6" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#4f9cf6" stop-opacity="0.015"/>
    </linearGradient>
    <filter id="py_shadow" x="-30%" y="-40%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="py_popsh" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <pattern id="py_grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 H 0 V 44" stroke="#cfe3ff" stroke-opacity="0.022"/>
    </pattern>
  </defs>

  <!-- 底：暗蓝台面（网格 + 蓝环境光 + 右下一点 Python 黄） -->
  <rect width="640" height="640" fill="url(#py_bg)"/>
  <rect width="640" height="640" fill="url(#py_glowTL)"/>
  <rect width="640" height="640" fill="url(#py_glowBR)"/>
  <rect width="640" height="640" fill="url(#py_grid)"/>

  <!-- 左下浮标：躺着的 Python 提示符 `>>>` -->
  <g font-family="Consolas, 'JetBrains Mono', monospace">
    <text x="66" y="576" font-size="34" font-weight="600" opacity="0.15">&gt;&gt;&gt;</text>
    <rect x="156" y="545" width="3" height="31" fill="#FFD43B" opacity="0.3"/>
  </g>

  <!-- 窗口 -->
  <rect x="44" y="104" width="552" height="428" rx="20" fill="#000" opacity="0.5" filter="url(#py_shadow)"/>
  <rect x="44" y="104" width="552" height="428" rx="20" fill="#0b0e17"/>
  <rect x="44" y="104" width="552" height="428" rx="20" stroke="#9cc4ff" stroke-opacity="0.12"/>
  <rect x="46.5" y="106.5" width="547" height="31" rx="15" fill="#9cc4ff" fill-opacity="0.025"/>

  <!-- 标题栏：窗钮 + 居中「python · pyright」 -->
  <circle cx="70" cy="122" r="5.5" fill="#ff5f57"/>
  <circle cx="87" cy="122" r="5.5" fill="#febc2e"/>
  <circle cx="104" cy="122" r="5.5" fill="#28c840"/>
  <text x="320" y="126" text-anchor="middle" font-family="Consolas, 'JetBrains Mono', monospace" font-size="12.5" fill="#8aa0c8" letter-spacing="2">PYTHON&nbsp;&nbsp;·&nbsp;&nbsp;PYRIGHT LSP</text>

  <!-- 标签行：python 徽章 + 活跃 tab app.py（黄下划线） -->
  <rect x="44" y="138" width="552" height="38" fill="url(#py_tabrow)"/>
  <line x1="44" y1="176" x2="596" y2="176" stroke="#9cc4ff" stroke-opacity="0.06"/>
  <rect x="58" y="147" width="20" height="20" rx="6" fill="url(#py_badge)"/>
  <text x="92" y="163" font-family="Consolas, 'JetBrains Mono', monospace" font-size="13" fill="#e6edf7">app.py</text>
  <rect x="92" y="170" width="46" height="2.2" fill="#FFD43B"/>
  <text x="186" y="163" font-family="Consolas, 'JetBrains Mono', monospace" font-size="12.5" fill="#5d6a8a">reader.py</text>
  <text x="286" y="163" font-family="Consolas, 'JetBrains Mono', monospace" font-size="12.5" fill="#5d6a8a" opacity="0.7">plot_demo.py</text>
  <circle cx="568" cy="157" r="8" fill="#9cc4ff" fill-opacity="0.1"/>
  <path d="M 568 153 v 8 M 564 157 h 8" stroke="#8aa0c8" stroke-width="1.6" stroke-linecap="round"/>

  <!-- 代码区 -->
  <g font-family="Consolas, 'JetBrains Mono', monospace" font-size="13">
    <!-- gutter line numbers -->
    <g fill="#3a4460" text-anchor="end">
      <text x="78" y="206">1</text>
      <text x="78" y="234">2</text>
      <text x="78" y="262">3</text>
      <text x="78" y="290">4</text>
      <text x="78" y="318">5</text>
      <text x="78" y="346">6</text>
      <text x="78" y="374">7</text>
      <text x="78" y="402">8</text>
      <text x="78" y="430">9</text>
    </g>
    <line x1="90" y1="188" x2="90" y2="452" stroke="#9cc4ff" stroke-opacity="0.05"/>

    <!-- 1: from serial import Serial -->
    <text x="102" y="206"><tspan fill="#c678dd">from</tspan><tspan fill="#c8d0e0"> serial </tspan><tspan fill="#c678dd">import</tspan><tspan fill="#e5c07b"> Serial</tspan></text>
    <!-- 3: class LineChart: -->
    <text x="102" y="262"><tspan fill="#c678dd">class</tspan><tspan fill="#e5c07b"> LineChart</tspan><tspan fill="#c8d0e0">:</tspan></text>
    <!-- 4: def render -->
    <text x="102" y="290"><tspan fill="#c678dd">    def</tspan><tspan fill="#61afef"> render</tspan><tspan fill="#c8d0e0">(self, rows: </tspan><tspan fill="#e5c07b">list</tspan><tspan fill="#c8d0e0">):</tspan></text>
    <!-- 5: return rows -->
    <text x="102" y="318"><tspan fill="#c678dd">        return</tspan><tspan fill="#c8d0e0"> rows</tspan></text>
    <!-- 7: chart = LineChart() -->
    <text x="102" y="374"><tspan fill="#c8d0e0">chart = </tspan><tspan fill="#e5c07b">LineChart</tspan><tspan fill="#c8d0e0">()</tspan></text>
    <!-- 8: chart.render(  + 竖光标 -->
    <text x="102" y="402"><tspan fill="#c8d0e0">chart.</tspan></text>
    <line x1="155" y1="388" x2="155" y2="409" stroke="#61afef" stroke-width="2.4" stroke-linecap="round"/>
    <!-- 9: chart.render(rows)   —— 类型诊断红波浪在 rows 下 -->
    <text x="102" y="430"><tspan fill="#c8d0e0">chart.</tspan><tspan fill="#61afef">render</tspan><tspan fill="#c8d0e0">(</tspan><tspan fill="#e5c07b">rows</tspan><tspan fill="#c8d0e0">)</tspan></text>
    <path d="M 205 439 q 2.5 -3 5 0 t 5 0 t 5 0 t 5 0 t 5 0 t 5 0 t 5 0" fill="none" stroke="#e06c75" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- 智能补全浮层（pyright，选中 render） -->
  <g>
    <rect x="352" y="336" width="232" height="118" rx="10" fill="#000" opacity="0.35" filter="url(#py_popsh)"/>
    <rect x="352" y="336" width="232" height="118" rx="10" fill="#141927"/>
    <rect x="352" y="336" width="232" height="118" rx="10" stroke="#9cc4ff" stroke-opacity="0.14"/>
    <rect x="352" y="336" width="3.5" height="118" rx="1.75" fill="#4f9cf6"/>
    <text x="372" y="356" font-family="'Microsoft YaHei UI', sans-serif" font-size="9.5" fill="#6b7ba0" letter-spacing="0.5">成员补全</text>
    <text x="572" y="356" text-anchor="end" font-family="Consolas, 'JetBrains Mono', monospace" font-size="9" fill="#6b7ba0">pyright 1.1.413</text>
    <line x1="372" y1="366" x2="566" y2="366" stroke="#9cc4ff" stroke-opacity="0.07"/>
    <!-- 选中行 render -->
    <rect x="366" y="374" width="204" height="26" rx="6" fill="#4f9cf6" fill-opacity="0.16"/>
    <rect x="366" y="374" width="2.5" height="26" rx="1.25" fill="#4f9cf6"/>
    <rect x="378" y="384" width="7" height="7" rx="2" fill="#61afef"/>
    <text x="392" y="391" font-family="Consolas, 'JetBrains Mono', monospace" font-size="12" fill="#e6edf7">render</text>
    <text x="548" y="391" text-anchor="end" font-family="Consolas, 'JetBrains Mono', monospace" font-size="10.5" fill="#6b7ba0">rows: list</text>
    <!-- 其余候选 -->
    <rect x="378" y="412" width="7" height="7" rx="2" fill="#4f9cf6"/>
    <text x="392" y="419" font-family="Consolas, 'JetBrains Mono', monospace" font-size="12" fill="#8aa0c8">save</text>
    <rect x="378" y="436" width="7" height="7" rx="2" fill="#4f9cf6"/>
    <text x="392" y="443" font-family="Consolas, 'JetBrains Mono', monospace" font-size="12" fill="#8aa0c8">export_csv</text>
  </g>

  <!-- 状态栏 -->
  <rect x="44" y="484" width="552" height="48" fill="url(#py_status)"/>
  <line x1="44" y1="484" x2="596" y2="484" stroke="#9cc4ff" stroke-opacity="0.08"/>
  <g font-family="Consolas, 'JetBrains Mono', monospace" font-size="12">
    <circle cx="70" cy="508" r="4" fill="#28c840"/>
    <text x="82" y="513" fill="#9fb4d8">pyright 已就绪</text>
    <text x="220" y="513" fill="#5d6a8a">Python</text>
    <text x="300" y="513" fill="#5d6a8a">Ln 9, Col 16</text>
    <text x="546" y="513" text-anchor="end" fill="#e06c75">✕ 1 诊断</text>
  </g>
</svg>
