<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- settings 小图标「设置的窗」品牌块：板岩渐变块 + 白色齿轮描边（软件设置系统位 → 中性灰调）
       齿轮取 lucide settings 轮廓描边（stroke 画法保齿形与空孔，白描边自带中心圆环）
       界面 img 显示用 → 全实色自含 -->
  <defs>
    <linearGradient id="seti_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#64748B"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="seti_glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="40" height="40" rx="10" fill="url(#seti_bg)"/>
  <rect x="4" y="4" width="40" height="40" rx="10" fill="url(#seti_glass)"/>

  <g fill="none" stroke="#F8FAFC" stroke-width="1.85" transform="translate(4.4 4.4) scale(1.63)">
    <path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/>
    <circle cx="12" cy="12" r="3"/>
  </g>
</svg>
