<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinkDesk dev 宿主</title>
    <style>
      /* dev 宿主页 = SDK 工具 UI（非壳/非产品），中性配色 + 兜底主题变量让插件 var(--xxx) 不至全黑。
         固定值允许——不违反壳硬约束 16（那约束壳 UI；此页不属于壳渲染树）。

         🔴 :root 兜底集 = 壳仓 src/index.css 顶层 :root 块的 **token 全集照抄**（值同源，E6#134）——
         真机里插件能消费的 token 面就是宿主 :root 这一份；兜底少于它 ⇒ 作者在真机能用 var(--bg-card)
         在预览里解析为空、被迫写「中间兜底层」真机死代码。防手抄漂移 = src/dev-host.test.ts 的
         生成式对账（两块 token 名集合必须相等，壳加减 token 当场红）。⛔ 手改值前先对齐壳真源。 */
      :root {
        --bg-window: #1E1E1E;
        --bg-card: #2D2D2D;
        --bg-input: #3C3C3C;
        --text-primary: #D4D4D4;
        --text-secondary: #9D9D9D;
        --text-muted: #8A8A8A;
        --tone-surface-deep: #1A1A1A;
        --tone-ink-on-deep: #FFFFFF;
        --tone-surface-light: #F2F2F2;
        --tone-ink-on-light: #1A1A1A;
        --accent: #0078D4;
        --accent-hover: #1A8CE8;
        --border: #3C3C3C;
        --separator: #474747;
        --icon-inactive: #858585;
        --icon-filter-inactive: brightness(0) saturate(100%) invert(52%);
        --icon-filter-active: brightness(0) saturate(100%) invert(100%);
        --system-log: #6A6A6A;
        --sent-echo: #0078D4;
        --status-connected: #4EC9B0;
        --status-disconnected: #6A6A6A;
        --scrollbar-thumb: rgba(255, 255, 255, 0.15);
        --scrollbar-thumb-hover: rgba(255, 255, 255, 0.25);
        --tab-hover-bg: #353535;
        --drop-glass-bg: rgba(255, 255, 255, 0.08);
        --drop-glass-border: rgba(255, 255, 255, 0.10);
        --drop-glass-inner: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
        --dirty-dot: #CCA700;
        --context-menu-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
        --drag-preview-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
        --tab-active-shadow: 0 1px 4px rgba(0, 0, 0, 0.18);
        --floating-panel-backdrop: rgba(0, 0, 0, 0.35);
        --floating-panel-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        --floating-panel-shadow-dragging: 0 18px 60px rgba(0, 0, 0, 0.6);
        --scrim-dialog: rgba(0, 0, 0, 0.5);
        --scrim-overlay: rgba(0, 0, 0, 0.3);
        --bg-mask-color: #000;
        --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --font-mono: "JetBrains Mono", Consolas, monospace;
        --ui-scale: 1;
        --font-size-2xs: 11px;
        --font-size-xs: 12px;
        --font-size-sm: 13px;
        --font-size-md: 14px;
        --font-size-lg: 16px;
        --font-size-xl: 18px;
        --font-size-2xl: 22px;
        --font-size-3xl: 28px;
        --font-size-4xl: 30px;
        --radius-xs: 2px;
        --radius-sm: 4px;
        --radius-md: 6px;
        --radius-lg: 8px;
        --radius-2xl: 16px;
        --radius-pill: 999px;
        --radius-full: 50%;
        --shadow-hairline: 0 0 1px rgba(0, 0, 0, 0.2);
        --shadow-tiny: 0 0 2px rgba(0, 0, 0, 0.5);
        --shadow-float: 0 4px 16px rgba(0, 0, 0, 0.25);
        --shadow-pop: 0 4px 12px rgba(0, 0, 0, 0.4);
        --shadow-tooltip: 0 2px 8px rgba(0, 0, 0, 0.3);
        --shadow-dialog: 0 8px 32px rgba(0, 0, 0, 0.5);
        --shadow-dialog-soft: 0 8px 32px rgba(0, 0, 0, 0.35);
        --shadow-lift: 0 8px 24px rgba(0, 0, 0, 0.4);
        --error: #E06C75;
        --warning: #CCA700;
        --success: #4CAF50;
        --badge-text: var(--text-on-accent);
        --badge-background: var(--accent);
        --badge-foreground: var(--badge-text);
        --bg-titlebar: #252526;
        --bg-icon-bar: #18181B;
        --bg-side-panel: #1E1E22;
        --bg-toolbar: #1E1E22;
        --titlebar-close-hover: #c42b1c;
        --toggle-knob: #FFFFFF;
        --hover-overlay: rgba(255, 255, 255, 0.06);
        --icon-btn-hover-bg: rgba(255, 255, 255, 0.1);
        --kbd-bg: rgba(128, 128, 128, 0.1);
        --kbd-border: rgba(128, 128, 128, 0.12);
        --kbd-hover-bg: rgba(255, 255, 255, 0.2);
        --kbd-hover-border: rgba(255, 255, 255, 0.35);
        --bg-selection: color-mix(in srgb, var(--accent) 20%, transparent);
        --cm-timestamp: #8A8A8A;
        --z-dropdown: 650;
        --z-sticky: 200;
        --z-overlay-backdrop: 500;
        --z-overlay: 600;
        --z-drag-preview: 1000;
        --z-sidebar-sticky-header: 10;
        --warning-text: #E8AB3E;
        --warning-bg: rgba(255, 200, 0, 0.12);
        --text-on-accent: #FFFFFF;
        --danger: #EF4444;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--bg-window);
        color: var(--text-primary);
        font-family: var(--font-ui);
      }
      #ld-topbar {
        position: sticky; top: 0; z-index: 10;
        display: flex; align-items: center; gap: 8px;
        padding: 5px 12px; font-size: 12px;
        background: var(--bg-input); border-bottom: 1px solid var(--border);
        user-select: none;
      }
      #ld-topbar .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
      #ld-topbar .sep { opacity: 0.4; }
      #ld-topbar code { color: var(--sent-echo); font-family: var(--font-mono); }
      #ld-topbar .hint { color: var(--text-muted); margin-left: auto; }
      /* 🔴 挂载点必须有确定高度（E6#134）——真壳的标签页容器有确定高度，插件 height:100% 依赖它；
         这里 flex 链拉伸（html/body 100% → body 纵向 flex → #ld-root 吃满剩余），等价真机形态。
         少了它插件画布塌陷，作者被迫写 ResizeObserver 自愈真机死代码。防漂移 = src/dev-host.test.ts。 */
      body { display: flex; flex-direction: column; }
      #ld-root { flex: 1 1 auto; min-height: 0; padding: 0; }
    </style>
  </head>
  <body>
    <div id="ld-topbar">
      <span class="dot"></span>
      <span>LinkDesk dev 宿主</span>
      <span class="sep">·</span>
      <code id="ld-plugin-id"></code>
      <span class="hint">本地预览 · 无 Electron/IPC · 改码 HMR</span>
    </div>
    <div id="ld-root"></div>
    <script type="module" src="/dev-main.tsx"></script>
  </body>
</html>
