<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设置页面 E3.5 整改后 — 整体预览</title>
<style>
/* ══════════════════════════════════════════════════════════════
   CSS 变量 —— 暗色/浅色双主题
   ══════════════════════════════════════════════════════════════ */
:root {
  --bg-window: #1e1e1e;
  --bg-card: #252526;
  --bg-input: #3c3c3c;
  --text-primary: #cccccc;
  --text-secondary: #999;
  --text-muted: #777;
  --border: #3c3c3c;
  --separator: #454545;
  --accent: #0078d4;
  --accent-hover: #1a8ad4;
  --hover-overlay: rgba(255,255,255,0.04);
  --text-on-accent: #fff;
  --font-ui: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'Sarasa Mono SC', 'Cascadia Code', Consolas, monospace;
}
body.light {
  --bg-window: #f3f3f3;
  --bg-card: #ffffff;
  --bg-input: #ffffff;
  --text-primary: #333;
  --text-secondary: #666;
  --text-muted: #999;
  --border: #d4d4d4;
  --separator: #e8e8e8;
  --hover-overlay: rgba(0,0,0,0.04);
  --text-on-accent: #fff;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: var(--font-ui); background: #0d0d0d; color: var(--text-primary);
  display: flex; justify-content: center; padding: 30px;
}

/* ═══════════════════════════════════════════
   主题切换
   ═══════════════════════════════════════════ */
.theme-bar {
  position: fixed; top: 12px; right: 16px; display: flex; gap: 6px; z-index: 100;
}
.theme-bar button {
  padding: 4px 12px; border: 1px solid rgba(255,255,255,0.2); border-radius: 4px;
  background: rgba(255,255,255,0.06); color: #aaa; cursor: pointer; font-size: 11px;
  font-family: var(--font-ui);
}
.theme-bar button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
body.light .theme-bar button { border-color: rgba(0,0,0,0.15); color: #666; }
body.light .theme-bar button.on { background: var(--accent); color: #fff; }

/* ═══════════════════════════════════════════
   设置编辑器
   ═══════════════════════════════════════════ */
.settings-editor {
  width: 800px; height: 85vh; display: flex; flex-direction: column;
  background: var(--bg-window); border-radius: 8px; overflow: hidden;
  box-shadow: 0 8px 40px rgba(0,0,0,0.5);
}

/* Tab 栏 —— ARIA 补全 */
.settings-tab-bar {
  display: flex; border-bottom: 1px solid var(--separator); padding: 0 16px;
  role: tablist;
}
.settings-tab {
  padding: 8px 16px; font-size: 13px; background: transparent; border: none;
  border-bottom: 2px solid transparent; color: var(--text-muted); cursor: pointer;
  margin-bottom: -1px; font-family: var(--font-ui);
}
.settings-tab:hover { color: var(--text-primary); }
.settings-tab[aria-selected="true"] {
  color: var(--text-primary); border-bottom-color: var(--accent);
}

/* 搜索栏 — 有 focus-visible */
.settings-search-bar {
  display: flex; align-items: center; padding: 8px 16px;
  border-bottom: 1px solid var(--separator); gap: 8px;
}
.search-icon { font-size: 14px; color: var(--text-muted); flex-shrink: 0; }
.search-input {
  flex: 1; background: var(--bg-input); border: 1px solid var(--border);
  color: var(--text-primary); font-size: 13px; padding: 4px 8px; outline: none;
  font-family: var(--font-ui);
}
.search-input:focus { border-color: var(--accent); }
.search-input:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
.json-btn {
  display: flex; align-items: center; gap: 4px; padding: 4px 8px;
  background: transparent; border: 1px solid var(--border); color: var(--text-primary);
  font-size: 12px; cursor: pointer; border-radius: 2px; font-family: var(--font-ui);
}
.json-btn:hover { background: var(--hover-overlay); }
.json-label { font-size: 11px; }

/* 主体 */
.settings-body {
  display: flex; flex: 1; overflow: hidden;
}

/* 左侧导航 — aria-current + focus-visible */
.settings-nav {
  width: 200px; flex-shrink: 0; overflow-y: auto;
  border-right: 1px solid var(--separator); padding: 8px 0;
}
.nav-item {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; padding: 6px 20px; font-size: 13px; color: var(--text-primary);
  background: transparent; border: none; border-left: 2px solid transparent;
  cursor: pointer; text-align: left; font-family: var(--font-ui);
  transition: background 100ms;
}
.nav-item:hover { background: var(--hover-overlay); }
.nav-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
.nav-item[aria-current="page"] {
  background: var(--hover-overlay); font-weight: 500; border-left-color: var(--accent);
}
.nav-count {
  font-size: 11px; color: var(--text-muted); background: var(--hover-overlay);
  padding: 0 6px; border-radius: 10px;
}

/* 右侧表单 */
.settings-form {
  flex: 1; overflow-y: auto; padding: 20px 28px;
}
.group-title {
  font-size: 18px; font-weight: 600; margin-bottom: 20px; padding-bottom: 12px;
  border-bottom: 1px solid var(--separator); color: var(--text-primary);
}

/* 设置行 */
.set-row {
  display: flex; align-items: flex-start; justify-content: space-between;
  padding: 10px 0; border-bottom: 1px solid var(--separator); gap: 20px;
  padding-left: 10px; border-left: 2px solid transparent;
  transition: border-left-color 150ms;
}
/* ★ 修改标记——左侧蓝线 */
.set-row.modified {
  border-left-color: var(--accent);
}
.set-row-info { flex: 1; min-width: 0; }
.set-row-label {
  display: block; font-size: 13px; font-weight: 500; color: var(--text-primary);
  margin-bottom: 3px; cursor: pointer;
}
.set-row-desc { display: block; font-size: 12px; color: var(--text-muted); line-height: 1.5; }
.set-row-control {
  flex-shrink: 0; display: flex; align-items: center; min-width: 100px;
  justify-content: flex-end; gap: 4px;
}

/* 控件 */
.sel {
  background: var(--bg-input); border: 1px solid var(--border); border-radius: 3px;
  color: var(--text-primary); font-size: 12px; padding: 3px 8px; cursor: pointer;
  font-family: var(--font-ui);
}
.tgl {
  width: 28px; height: 16px; border-radius: 8px; background: var(--accent);
  position: relative; cursor: pointer; flex-shrink: 0;
}
.tgl::after {
  content: ''; position: absolute; top: 2px; left: 14px;
  width: 12px; height: 12px; border-radius: 50%; background: #fff;
}
.tgl.off { background: var(--border); }
.tgl.off::after { left: 2px; }
.text-inp {
  background: var(--bg-input); border: 1px solid var(--border); border-radius: 3px;
  color: var(--text-primary); font-size: 12px; padding: 3px 8px; font-family: var(--font-mono);
  outline: none; width: 160px;
}
.text-inp:focus { border-color: var(--accent); }
.text-inp:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }

/* 齿轮 —— hover + focus-within 双揭示 + focus-visible */
.set-row-gear {
  flex-shrink: 0; width: 24px; height: 24px; display: flex; align-items: center;
  justify-content: center; background: transparent; border: none; border-radius: 3px;
  color: var(--text-muted); font-size: 13px; cursor: pointer;
  opacity: 0; transition: opacity 120ms ease, background 120ms ease; margin-left: 4px;
}
.set-row:hover .set-row-gear,
.set-row:focus-within .set-row-gear { opacity: 1; }
.set-row-gear:hover { background: var(--hover-overlay); color: var(--text-primary); }
.set-row-gear:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; opacity: 1; }

/* 色块 */
.color-swatch {
  width: 20px; height: 20px; border-radius: 3px; border: 1px solid var(--separator);
  flex-shrink: 0; cursor: pointer;
}
.color-swatch:hover { border-color: var(--accent); }

/* ═══════════════════════════════════════════
   浅色覆写
   ═══════════════════════════════════════════ */
body.light .settings-editor { box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
</style>
</head>
<body>

<div class="theme-bar">
  <button id="btn-dark" class="on" onclick="setTheme('dark')">暗色</button>
  <button id="btn-light" onclick="setTheme('light')">浅色</button>
</div>

<div class="settings-editor">

  <!-- Tab 栏 —— aria-selected ✓ -->
  <div class="settings-tab-bar" role="tablist">
    <button class="settings-tab" role="tab" aria-selected="true">设置</button>
    <button class="settings-tab" role="tab" aria-selected="false" style="color:var(--text-muted)">快捷键</button>
  </div>

  <!-- 搜索栏 ✓ -->
  <div class="settings-search-bar">
    <span class="search-icon">🔍</span>
    <input class="search-input" type="text" placeholder="搜索设置" value="">
    <button class="json-btn"><span>JSON</span></button>
  </div>

  <div class="settings-body">

    <!-- 左侧导航 —— aria-current ✓ -->
    <nav class="settings-nav">
      <button class="nav-item" aria-current="page">
        通用
        <span class="nav-count">5</span>
      </button>
      <button class="nav-item" aria-current="false">
        串口监视器
        <span class="nav-count">2</span>
      </button>
      <button class="nav-item" aria-current="false">
        主题
        <span class="nav-count">3</span>
      </button>
      <button class="nav-item" aria-current="false">
        快捷键
        <span class="nav-count">3</span>
      </button>
    </nav>

    <!-- 右侧表单 ✓ -->
    <div class="settings-form">

      <h2 class="group-title">通用</h2>

      <!-- ★ 已修改——左侧蓝线 -->
      <div class="set-row modified" id="setting-row-app.theme">
        <div class="set-row-info">
          <label class="set-row-label" for="ctrl-app.theme">配色主题</label>
          <span class="set-row-desc">选择界面配色主题</span>
        </div>
        <div class="set-row-control">
          <select class="sel" id="ctrl-app.theme">
            <option>Dark</option>
            <option>Light</option>
            <option>Amber HC</option>
          </select>
        </div>
        <button class="set-row-gear" tabindex="0" title="更多操作" aria-label="配色主题 更多操作">⚙</button>
      </div>

      <!-- ★ 已修改 -->
      <div class="set-row modified" id="setting-row-app.language">
        <div class="set-row-info">
          <label class="set-row-label" for="ctrl-app.language">界面语言</label>
          <span class="set-row-desc">选择界面显示语言</span>
        </div>
        <div class="set-row-control">
          <select class="sel" id="ctrl-app.language">
            <option>中文</option>
            <option>English</option>
          </select>
        </div>
        <button class="set-row-gear" tabindex="0" title="更多操作" aria-label="界面语言 更多操作">⚙</button>
      </div>

      <!-- 未修改——无蓝线 -->
      <div class="set-row" id="setting-row-app.accentMode">
        <div class="set-row-info">
          <label class="set-row-label" for="ctrl-app.accentMode">强调色模式</label>
          <span class="set-row-desc">跟随主题或使用自定义强调色</span>
        </div>
        <div class="set-row-control">
          <select class="sel" id="ctrl-app.accentMode">
            <option>自定义</option>
            <option>跟随主题</option>
          </select>
        </div>
        <button class="set-row-gear" tabindex="0" title="更多操作" aria-label="强调色模式 更多操作">⚙</button>
      </div>

      <!-- 色块设置项 -->
      <div class="set-row modified" id="setting-row-app.accentColor">
        <div class="set-row-info">
          <label class="set-row-label" for="ctrl-app.accentColor">自定义强调色</label>
          <span class="set-row-desc">选择自定义强调色，仅强调色模式为"自定义"时生效</span>
        </div>
        <div class="set-row-control">
          <span class="color-swatch" style="background:#ff8c00"></span>
          <input class="text-inp" id="ctrl-app.accentColor" type="text" value="#ff8c00">
        </div>
        <button class="set-row-gear" tabindex="0" title="更多操作" aria-label="自定义强调色 更多操作">⚙</button>
      </div>

      <!-- 未修改 -->
      <div class="set-row" id="setting-row-app.fontFamily">
        <div class="set-row-info">
          <label class="set-row-label" for="ctrl-app.fontFamily">字体</label>
          <span class="set-row-desc">界面字体家族</span>
        </div>
        <div class="set-row-control">
          <input class="text-inp" id="ctrl-app.fontFamily" type="text" value="Inter, sans-serif">
        </div>
        <button class="set-row-gear" tabindex="0" title="更多操作" aria-label="字体 更多操作">⚙</button>
      </div>

    </div>
  </div>
</div>

<script>
function setTheme(t) {
  document.body.className = t === 'light' ? 'light' : '';
  document.getElementById('btn-dark').classList.toggle('on', t === 'dark');
  document.getElementById('btn-light').classList.toggle('on', t === 'light');
}
</script>

</body>
</html>
