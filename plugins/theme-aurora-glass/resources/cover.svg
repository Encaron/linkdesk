<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" fill="none">
  <!-- ============================================================
       极光玻璃 封面  [skill: high-end-visual-design · Ethereal Glass]
       理念：该主题 =「极光夜空 + 液态玻璃表面」——玻璃面板永远浮在
       aurora 之上。封面自证主题：一片极光（teal/indigo/violet/pink）
       从深空涌出，中央一块 Double-Bezel 磨砂玻璃，玻璃里透出一角
       被主题化的 UI 缩影（accent 紫、connected 青、发丝高光）。
       资产独立 SVG：颜色自含。
       ============================================================ -->
  <defs>
    <linearGradient id="ag_base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070f"/>
      <stop offset="0.55" stop-color="#080b1c"/>
      <stop offset="1" stop-color="#0a1026"/>
    </linearGradient>

    <!-- 极光色带（纯色低透明度 + 大模糊 → 光带） -->
    <linearGradient id="ag_bandT" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ag_bandI" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4338ca" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#6366f1" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="ag_bandV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.2" stop-color="#7c3aed" stop-opacity="0.05"/>
      <stop offset="0.6" stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="ag_bandP" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.55" stop-color="#ec4899" stop-opacity="0.05"/>
      <stop offset="0.85" stop-color="#ec4899" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>

    <!-- 光球 -->
    <radialGradient id="ag_orbV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ag_orbP" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ag_orbT" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>

    <!-- 玻璃渐变 -->
    <linearGradient id="ag_shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.25" stop-color="#ffffff" stop-opacity="0.045"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="ag_core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2350" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0c1130" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="ag_sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="0.28" stop-color="#ffffff" stop-opacity="0.01"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ag_word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eef1ff"/>
      <stop offset="1" stop-color="#aab6f5"/>
    </linearGradient>

    <filter id="ag_blurT" x="-60%" y="-300%" width="220%" height="700%"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="ag_blurS" x="-60%" y="-300%" width="220%" height="700%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="ag_blurB" x="-80%" y="-300%" width="260%" height="700%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="ag_glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <!-- 深空底 -->
  <rect width="640" height="640" fill="url(#ag_base)"/>

  <!-- 光球（Ethereal mesh orbs） -->
  <circle cx="140" cy="140" r="240" fill="url(#ag_orbV)"/>
  <circle cx="520" cy="500" r="250" fill="url(#ag_orbP)"/>
  <circle cx="360" cy="250" r="170" fill="url(#ag_orbT)"/>

  <!-- 极光色带：整体 -18° 斜扫（呼应 aurora-bg 的斜向夜空） -->
  <g transform="rotate(-16 320 320)">
    <g filter="url(#ag_blurB)">
      <rect x="-140" y="170" width="920" height="90" fill="url(#ag_bandT)"/>
    </g>
    <g filter="url(#ag_blurB)">
      <rect x="-140" y="280" width="920" height="110" fill="url(#ag_bandI)"/>
    </g>
    <g filter="url(#ag_blurB)">
      <rect x="-140" y="410" width="920" height="120" fill="url(#ag_bandV)"/>
    </g>
    <g filter="url(#ag_blurB)">
      <rect x="-140" y="540" width="920" height="90" fill="url(#ag_bandP)"/>
    </g>
  </g>

  <!-- 后层小玻璃片（Z 轴深度） -->
  <g transform="rotate(4 470 90)">
    <rect x="412" y="46" width="150" height="96" rx="26" fill="url(#ag_shell)" stroke="#ffffff" stroke-opacity="0.16"/>
    <rect x="424" y="58" width="126" height="72" rx="18" fill="url(#ag_sheen)"/>
    <circle cx="452" cy="86" r="8" fill="#7c3aed" opacity="0.9"/>
    <rect x="470" y="82" width="58" height="7" rx="3.5" fill="#ffffff" opacity="0.22"/>
    <rect x="470" y="96" width="40" height="6" rx="3" fill="#ffffff" opacity="0.12"/>
  </g>

  <!-- 主玻璃面板：Double-Bezel（外壳 + 内芯 + 顶部发丝 + 斜向高光） -->
  <g>
    <!-- 外壳 -->
    <rect x="112" y="152" width="416" height="330" rx="46" fill="url(#ag_shell)" stroke="#ffffff" stroke-opacity="0.16"/>
    <!-- 内芯 -->
    <rect x="124" y="164" width="392" height="306" rx="34" fill="url(#ag_core)" stroke="#ffffff" stroke-opacity="0.10"/>
    <!-- 顶部发丝高光 -->
    <rect x="124" y="164" width="392" height="96" rx="34" fill="url(#ag_sheen)"/>
    <!-- 斜向高光（左上） -->
    <path d="M 124 232 C 230 150, 330 150, 516 176 L 516 236 C 380 210, 240 214, 124 300 Z" fill="#ffffff" opacity="0.05"/>
  </g>

  <!-- 玻璃内：被主题化的 UI 缩影 -->
  <g>
    <!-- 顶部胶囊 eyebrow -->
    <rect x="158" y="196" width="86" height="20" rx="10" fill="#ffffff" opacity="0.07" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="176" cy="206" r="3.5" fill="#2dd4bf"/>
    <text x="190" y="210" font-family="Consolas,monospace" font-size="10.5" fill="#cdd6f5" letter-spacing="1">THEME</text>

    <!-- 设置行 1（含 accent 紫引导 + 高亮条 = 被选中的玻璃项） -->
    <rect x="158" y="236" width="324" height="52" rx="16" fill="#ffffff" opacity="0.05"/>
    <rect x="158" y="240" width="4" height="44" rx="2" fill="#8b5cf6"/>
    <circle cx="196" cy="262" r="11" fill="url(#ag_core)" stroke="#a78bfa" stroke-opacity="0.6"/>
    <circle cx="196" cy="262" r="4.5" fill="#a78bfa"/>
    <rect x="222" y="252" width="120" height="8" rx="4" fill="#ffffff" opacity="0.30"/>
    <rect x="222" y="268" width="76" height="6" rx="3" fill="#ffffff" opacity="0.14"/>
    <rect x="404" y="252" width="52" height="24" rx="12" fill="#7c3aed" opacity="0.85"/>
    <circle cx="446" cy="264" r="8" fill="#ffffff" opacity="0.92"/>

    <!-- 设置行 2 skeleton -->
    <rect x="158" y="306" width="324" height="44" rx="14" fill="#ffffff" opacity="0.03"/>
    <circle cx="196" cy="328" r="10" fill="#ffffff" opacity="0.08" stroke="#ffffff" stroke-opacity="0.14"/>
    <rect x="222" y="322" width="160" height="7" rx="3.5" fill="#ffffff" opacity="0.16"/>
    <rect x="222" y="336" width="96" height="5" rx="2.5" fill="#ffffff" opacity="0.08"/>

    <!-- 行 3：connected 青色联通态（呼应 status-connected） -->
    <rect x="158" y="366" width="324" height="44" rx="14" fill="#ffffff" opacity="0.03"/>
    <circle cx="196" cy="388" r="10" fill="#ffffff" opacity="0.08" stroke="#ffffff" stroke-opacity="0.14"/>
    <rect x="222" y="382" width="140" height="7" rx="3.5" fill="#ffffff" opacity="0.16"/>
    <circle cx="440" cy="388" r="5" fill="#2dd4bf"/>
    <rect x="432" y="387" width="16" height="2" rx="1" fill="#ffffff" opacity="0.4"/>
  </g>

  <!-- 玻璃面上一点反光星（发丝） -->
  <circle cx="150" cy="196" r="2.4" fill="#ffffff" opacity="0.8" filter="url(#ag_glow)"/>

  <!-- 字标 -->
  <text x="320" y="530" text-anchor="middle" font-family="'Segoe UI Variable','SF Pro Display',sans-serif" font-size="13" letter-spacing="7" fill="#7f89b8">LINKDESK · THEME</text>
  <text x="320" y="582" text-anchor="middle" font-family="'Segoe UI Variable','SF Pro Display','Plus Jakarta Sans',sans-serif" font-weight="300" font-size="58" fill="url(#ag_word)">Aurora Glass</text>
  <text x="320" y="612" text-anchor="middle" font-family="Consolas,monospace" font-size="11.5" letter-spacing="3" fill="#5f6a9c">DARK · LIQUID GLASS · AURORA NIGHT</text>
</svg>
