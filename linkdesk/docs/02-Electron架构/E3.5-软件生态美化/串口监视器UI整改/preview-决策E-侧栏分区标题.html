<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>决策 E：侧栏设置组分区标题 — 对比预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #1e1e1e; color: #cccccc;
    padding: 40px;
    display: flex; gap: 40px; justify-content: center; flex-wrap: wrap;
  }
  h2 { font-size: 16px; margin-bottom: 20px; color: #ffffff; text-align: center; }
  .panel {
    width: 340px; background: #252526; border: 1px solid #3c3c3c; border-radius: 6px;
    overflow: hidden;
  }
  .panel-header {
    padding: 10px 16px; font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.5px; color: #bbbbbb; border-bottom: 1px solid #3c3c3c;
    display: flex; justify-content: space-between; align-items: center;
  }
  .panel-body { padding: 8px 0; }

  /* 共享 */
  .setting-group { padding: 4px 0; }
  .setting-group + .setting-group { border-top: 1px solid #3c3c3c; }
  .form-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 16px; gap: 12px;
  }
  .form-row-label { font-size: 12px; color: #cccccc; }
  .form-row-control { flex-shrink: 0; }
  .toggle {
    width: 32px; height: 18px; border-radius: 9px; background: #0078d4;
    position: relative; cursor: pointer;
  }
  .toggle::after {
    content: ''; position: absolute; top: 2px; left: 16px;
    width: 14px; height: 14px; border-radius: 50%; background: #fff;
  }
  .select {
    background: #3c3c3c; border: 1px solid #555; border-radius: 3px;
    color: #ccc; font-size: 12px; padding: 3px 8px; cursor: pointer;
  }
  .input-num {
    background: #3c3c3c; border: 1px solid #555; border-radius: 3px;
    color: #ccc; font-size: 12px; padding: 3px 6px; width: 70px;
  }

  /* B 方案：分区标题 */
  .setting-section-label {
    padding: 8px 16px 2px;
    font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.5px; color: #888;
  }

  .badge { background: #0078d4; color: #fff; }

  /* 浅色主题 */
  body.light { background: #f3f3f3; color: #333; }
  body.light .panel { background: #ffffff; border-color: #ddd; }
  body.light .panel-header { color: #333; border-bottom-color: #ddd; }
  body.light .form-row-label { color: #333; }
  body.light .setting-group + .setting-group { border-top-color: #ddd; }
  body.light .select { background: #fff; border-color: #ccc; color: #333; }
  body.light .input-num { background: #fff; border-color: #ccc; color: #333; }
  body.light .setting-section-label { color: #888; }
</style>
</head>
<body>

<!-- 方案 A：无分区标题（当前） -->
<div class="panel">
  <div class="panel-header">收发设置 — 会话1</div>
  <div class="panel-body">
    <div class="setting-group">
      <div class="form-row"><span class="form-row-label">时间戳</span><select class="select"><option>HH:mm:ss:fff</option></select></div>
      <div class="form-row"><span class="form-row-label">消息回显</span><span class="toggle"></span></div>
      <div class="form-row"><span class="form-row-label">行号显示</span><span class="toggle"></span></div>
      <div class="form-row"><span class="form-row-label">系统消息独立显示</span><span class="toggle"></span></div>
    </div>
    <div class="setting-group">
      <div class="form-row"><span class="form-row-label">换行符</span><select class="select"><option>\r\n</option></select></div>
      <div class="form-row"><span class="form-row-label">定时发送</span><span class="toggle"></span></div>
      <div class="form-row"><span class="form-row-label">发送后清空</span><span class="toggle"></span></div>
    </div>
    <div class="setting-group">
      <div class="form-row"><span class="form-row-label">接收模式</span><select class="select"><option>文本</option></select></div>
      <div class="form-row"><span class="form-row-label">接收编码</span><select class="select"><option>UTF-8</option></select></div>
      <div class="form-row"><span class="form-row-label">发送模式</span><select class="select"><option>文本</option></select></div>
      <div class="form-row"><span class="form-row-label">发送编码</span><select class="select"><option>UTF-8</option></select></div>
    </div>
  </div>
</div>

<!-- 方案 B：带分区标题 -->
<div class="panel">
  <div class="panel-header" style="justify-content:center;color:#888;">方案 B：加分区标题</div>
  <div class="panel-body">
    <div class="setting-section-label">显示</div>
    <div class="setting-group">
      <div class="form-row"><span class="form-row-label">时间戳</span><select class="select"><option>HH:mm:ss:fff</option></select></div>
      <div class="form-row"><span class="form-row-label">消息回显</span><span class="toggle"></span></div>
      <div class="form-row"><span class="form-row-label">行号显示</span><span class="toggle"></span></div>
      <div class="form-row"><span class="form-row-label">系统消息独立显示</span><span class="toggle"></span></div>
    </div>
    <div class="setting-section-label">发送行为</div>
    <div class="setting-group">
      <div class="form-row"><span class="form-row-label">换行符</span><select class="select"><option>\r\n</option></select></div>
      <div class="form-row"><span class="form-row-label">定时发送</span><span class="toggle"></span></div>
      <div class="form-row"><span class="form-row-label">发送后清空</span><span class="toggle"></span></div>
    </div>
    <div class="setting-section-label">编码</div>
    <div class="setting-group">
      <div class="form-row"><span class="form-row-label">接收模式</span><select class="select"><option>文本</option></select></div>
      <div class="form-row"><span class="form-row-label">接收编码</span><select class="select"><option>UTF-8</option></select></div>
      <div class="form-row"><span class="form-row-label">发送模式</span><select class="select"><option>文本</option></select></div>
      <div class="form-row"><span class="form-row-label">发送编码</span><select class="select"><option>UTF-8</option></select></div>
    </div>
  </div>
</div>

</body>
</html>
