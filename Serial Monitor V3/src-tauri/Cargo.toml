[package]
name = "linkdesk"
version = "0.1.0"
edition = "2021"

[lib]
name = "linkdesk_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
tokio = { version = "1", features = ["sync", "rt"] }
encoding_rs = "0.8"
