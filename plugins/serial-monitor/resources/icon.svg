<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- serial-monitor 小图标「串口的窗」品牌块：青绿渐变块 + 白色 UART 方波
       一条数据帧：高电平空闲 → 起始位拉低 → 数据位高低翻转 → 停止位回高
       界面 img 显示用 → 全实色自含 -->
  <defs>
    <linearGradient id="seri_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="seri_glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="40" height="40" rx="10" fill="url(#seri_bg)"/>
  <rect x="4" y="4" width="40" height="40" rx="10" fill="url(#seri_glass)"/>

  <!-- UART 数据帧方波（idle 高 → start 低 → 数据位 → stop 高） -->
  <path d="M9 17.5 H11 V29 H14.5 V17.5 H18 V29 H21.5 V17.5 H25 V29 H28.5 V17.5 H32 V29 H35 V17.5 H38"
        fill="none" stroke="#F0FDFA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 连接状态小绿点（封面状态栏绿色呼应） -->
  <circle cx="12.5" cy="36.5" r="2.6" fill="#A7F3D0"/>
  <circle cx="12.5" cy="36.5" r="1.1" fill="#065F46"/>
</svg>
