  </defs>
  <rect x="4" y="4" width="40" height="40" rx="8" fill="#1B1813"/>
  <rect x="7" y="7" width="14" height="9" rx="2" fill="url(#zoneBg)" opacity="0.9"/>
  <rect x="7" y="19" width="14" height="22" rx="2" fill="url(#zoneBg)" opacity="0.65"/>
  <rect x="24" y="7" width="17" height="15" rx="2" fill="url(#zoneBg)" opacity="0.8"/>
  <rect x="24" y="25" width="17" height="16" rx="2" fill="url(#zoneBg)" opacity="0.55"/>
