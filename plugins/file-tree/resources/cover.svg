<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" fill="none">
  <!-- ============================================================
       file-tree 封面「文件树的窗」   [skill: ui-ux-pro-max · A 家族]
       理念：文件树 = 整个工作区的入场券。画「资源管理器张开着」——
       暗靛工程台面上一扇窗，窗内是文件夹展开的目录树：
       琥珀色文件夹逐级下钻、彩色类型点缀文件名、git 增改小圆点、
       一根醒目的蓝色选中行、node_modules 灰影已排除。
       它没有主界面（它是侧栏），所以把「侧栏本体」放大就是它的舞台。
       资产独立 SVG：颜色自含（封面美术不受壳主题 token 约束）。
       ============================================================ -->
  <defs>
    <radialGradient id="ft_bg" cx="0.5" cy="0.42" r="0.9">
      <stop offset="0" stop-color="#171a28"/>
      <stop offset="0.55" stop-color="#0f111c"/>
      <stop offset="1" stop-color="#08090f"/>
    </radialGradient>
    <radialGradient id="ft_glowTL" cx="0.15" cy="0.07" r="0.8">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ft_glowBR" cx="0.97" cy="1.05" r="0.85">
      <stop offset="0" stop-color="#eab34b" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#eab34b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ft_win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d111d"/>
      <stop offset="1" stop-color="#0a0d16"/>
    </linearGradient>
    <linearGradient id="ft_sel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f9cf6" stop-opacity="0.2"/>
      <stop offset="0.75" stop-color="#4f9cf6" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#4f9cf6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ft_status" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.015"/>
    </linearGradient>
    <filter id="ft_shadow" x="-30%" y="-40%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <pattern id="ft_grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 H 0 V 44" stroke="#cdd5ff" stroke-opacity="0.022"/>
    </pattern>
  </defs>

  <!-- 底：暗靛台面（网格 + 青色左上光 + 一点琥珀右下光） -->
  <rect width="640" height="640" fill="url(#ft_bg)"/>
  <rect width="640" height="640" fill="url(#ft_glowTL)"/>
  <rect width="640" height="640" fill="url(#ft_glowBR)"/>
  <rect width="640" height="640" fill="url(#ft_grid)"/>

  <!-- 左下浮标：躺着的文件夹 -->
  <g transform="translate(70 596) scale(0.9)" opacity="0.15">
    <path d="M3 4 a2.4 2.4 0 0 1 2.4-2.4 H9 L12 5 h8.6 a2.4 2.4 0 0 1 2.4 2.4 V17 a2.4 2.4 0 0 1-2.4 2.4 H5.4 A2.4 2.4 0 0 1 3 17 Z"
      fill="#eab34b"/>
    <path d="M3 4 a2.4 2.4 0 0 1 2.4-2.4 H9 L12 5 h8.6 a2.4 2.4 0 0 1 2.4 2.4 V7 H3 Z" fill="#ffffff" opacity="0.1"/>
  </g>

  <!-- 窗口 -->
  <rect x="44" y="104" width="552" height="428" rx="20" fill="#000" opacity="0.5" filter="url(#ft_shadow)"/>
  <rect x="44" y="104" width="552" height="428" rx="20" fill="url(#ft_win)"/>
  <rect x="44" y="104" width="552" height="428" rx="20" stroke="#9cc4ff" stroke-opacity="0.13"/>
  <rect x="46.5" y="106.5" width="547" height="31" rx="15" fill="#9cc4ff" fill-opacity="0.02"/>

  <!-- 标题栏：窗钮 + 居中「文件树 · 资源管理器」 -->
  <circle cx="70" cy="122" r="5.5" fill="#ff5f57"/>
  <circle cx="87" cy="122" r="5.5" fill="#febc2e"/>
  <circle cx="104" cy="122" r="5.5" fill="#28c840"/>
  <text x="320" y="127" text-anchor="middle" font-family="'Microsoft YaHei UI', sans-serif" font-size="12" fill="#8a95bd" letter-spacing="3">文件树 · 资源管理器</text>

  <!-- 工具行：工作区名 + 动作 -->
  <rect x="44" y="138" width="552" height="44" fill="#9cc4ff" fill-opacity="0.015"/>
  <line x1="44" y1="182" x2="596" y2="182" stroke="#9cc4ff" stroke-opacity="0.06"/>
  <path d="M62 158 a2 2 0 0 1 2-2 h3 l1.8 1.8 h6.2 a2 2 0 0 1 2 2 v3 a2 2 0 0 1-2 2 H64 a2 2 0 0 1-2-2 Z" fill="#eab34b"/>
  <text x="86" y="163" font-family="Consolas, 'JetBrains Mono', monospace" font-size="14.5" font-weight="600" fill="#e7eefb">linkdesk</text>
  <text x="172" y="163" font-family="'Microsoft YaHei UI', sans-serif" font-size="11" fill="#5f6c93">工作区 · Workspace</text>
  <g fill="none" stroke="#8a95bd" stroke-width="1.6" stroke-linecap="round">
    <path d="M 528 158 a6.5 6.5 0 1 1 -2 -4.6 M 528 152 v 4 h 4" transform="translate(-2 2)"/>
    <path d="M 552 161 h 10 M 557 156 v 10" transform="translate(-4 -1)"/>
    <path d="M 574 161 h 12 M 580 155 v 12 M 568 161 h 24" transform="translate(-6 0)"/>
  </g>

  <!-- 树区 -->
  <g font-family="Consolas, 'JetBrains Mono', monospace">
    <!-- r0 linkdesk 根（d0，打开） -->
    <path d="M 76 195 l 6 0 l -3 5.5 z" fill="#5f6c93"/>
    <rect x="96" y="194" width="9" height="9" rx="2.2" fill="#eab34b"/>
    <text x="112" y="203" font-size="13" font-weight="600" fill="#ffe0a0">linkdesk</text>

    <!-- r1 src（d1，打开） -->
    <path d="M 100 221 l 6 0 l -3 5.5 z" fill="#5f6c93"/>
    <rect x="120" y="220" width="9" height="9" rx="2.2" fill="#eab34b" opacity="0.92"/>
    <text x="136" y="229" font-size="13" fill="#eab34b">src</text>

    <!-- r2 index.tsx —— 选中行（d2，active） -->
    <rect x="56" y="243" width="532" height="24" rx="6" fill="url(#ft_sel)"/>
    <rect x="56" y="243" width="3" height="24" rx="1.5" fill="#4f9cf6"/>
    <text x="160" y="259" font-size="13" fill="#ffffff" font-weight="600">index.tsx</text>
    <rect x="144" y="250" width="8" height="8" rx="2.2" fill="#61afef"/>
    <circle cx="578" cy="255" r="3.6" fill="#28c840"/>
    <text x="592" y="259" font-size="10" fill="#3fb950" opacity="0.9">A</text>

    <!-- r3 views（d2，打开） -->
    <path d="M 148 277 l 6 0 l -3 5.5 z" fill="#5f6c93"/>
    <rect x="164" y="276" width="9" height="9" rx="2.2" fill="#eab34b" opacity="0.88"/>
    <text x="180" y="285" font-size="13" fill="#d9a94a">views</text>

    <!-- r4 DetailView.tsx（d3） -->
    <rect x="188" y="312" width="8" height="8" rx="2.2" fill="#61afef"/>
    <text x="204" y="321" font-size="12.5" fill="#b8c6e6">DetailView.tsx</text>
    <circle cx="578" cy="317" r="3.6" fill="#febc2e"/>
    <text x="592" y="321" font-size="10" fill="#e8b54a" opacity="0.9">M</text>

    <!-- r5 ExploreView.tsx（d3） -->
    <rect x="188" y="338" width="8" height="8" rx="2.2" fill="#e879f9"/>
    <text x="204" y="347" font-size="12.5" fill="#b8c6e6">ExploreView.tsx</text>

    <!-- r6 plugins（d1，收） -->
    <path d="M 108 373 l 5.5 3 l -5.5 3 z" fill="#5f6c93"/>
    <rect x="120" y="370" width="9" height="9" rx="2.2" fill="#eab34b" opacity="0.8"/>
    <text x="136" y="379" font-size="13" fill="#c99c43">plugins</text>

    <!-- r7 docs（d1，收） -->
    <path d="M 108 399 l 5.5 3 l -5.5 3 z" fill="#5f6c93"/>
    <rect x="120" y="396" width="9" height="9" rx="2.2" fill="#eab34b" opacity="0.8"/>
    <text x="136" y="405" font-size="13" fill="#c99c43">docs</text>

    <!-- r8 package.json（d1） -->
    <rect x="124" y="422" width="8" height="8" rx="2.2" fill="#f5c066"/>
    <text x="140" y="431" font-size="12.5" fill="#b8c6e6">package.json</text>

    <!-- r9 node_modules —— 灰影排除（d1 ghost） -->
    <rect x="124" y="448" width="8" height="8" rx="2.2" fill="#5f6c93" opacity="0.5"/>
    <text x="140" y="457" font-size="12.5" fill="#3b4463">node_modules</text>
    <text x="250" y="457" font-family="'Microsoft YaHei UI', sans-serif" font-size="10" fill="#3b4463">已排除 · gitignore</text>
  </g>

  <!-- 状态栏 -->
  <rect x="44" y="484" width="552" height="48" fill="url(#ft_status)"/>
  <line x1="44" y1="484" x2="596" y2="484" stroke="#9cc4ff" stroke-opacity="0.07"/>
  <g font-family="'Microsoft YaHei UI', sans-serif" font-size="11" fill="#7b85ab">
    <text x="66" y="513">选中 src/index.tsx · 12 文件 3 文件夹</text>
    <text x="462" y="513" font-family="Consolas, 'JetBrains Mono', monospace" font-size="10.5" fill="#8a95bd">Ctrl+Shift+E</text>
    <text x="544" y="513" font-size="10.5">资源管理器</text>
  </g>
</svg>
