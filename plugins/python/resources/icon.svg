<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- python 彩色图标「补全的块」：Python 蓝渐变块 + 白代码行 + 金黄光标
       意象 = 零 UI 的 Python LSP（pyright）在替你补全代码：一段代码 + 行尾金色块光标（Python 黄）
       Type-2 身份图 -->
  <defs>
    <linearGradient id="pyBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4B8BBE"/>
      <stop offset="1" stop-color="#14365E"/>
    </linearGradient>
    <linearGradient id="pyGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="40" height="40" rx="10" fill="url(#pyBg)"/>
  <rect x="4" y="4" width="40" height="40" rx="10" fill="url(#pyGlass)"/>
  <rect x="4" y="4" width="40" height="40" rx="10" fill="none" stroke="#BFDBFE" stroke-opacity="0.28" stroke-width="1"/>
  <!-- 两行代码 + 行尾金色块光标（Python 黄 #FFD43B），读作「正在被语言服务补全」 -->
  <g stroke="#F0F9FF" stroke-width="3" stroke-linecap="round">
    <path d="M15 20 H26.5"/>
    <path d="M15 29 H33"/>
  </g>
  <rect x="27.8" y="18.3" width="3.6" height="3.4" rx="0.7" fill="#FFD43B"/>
</svg>
