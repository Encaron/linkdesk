# electron-builder 打包配置
#
# E1 步 7：替代 Tauri 的 tauri.conf.json。
# 生成 NSIS 安装器（Windows .exe）。
#
# 关键设计：
#   - 插件源码不进包（extraResources = 只读 bundled-plugins 发货夹 + icon）；
#     安装/卸载/运行根全在 userData（E6#15d 消费切换相 #17a）
#   - linkdesk:// 协议根据 app.isPackaged 切换路径前缀
#   - npmRebuild 自动处理 serialport 原生模块

appId: com.linkdesk.app
productName: LinkDesk
copyright: Copyright © 2026 LinkDesk

# 🔥 E6#42e —— 安装包文件名的唯一真理源。别删、别改 `${name}` 的写法。
#
# 为什么不写会出事（2026-09-11 读 electron-builder 26.15.3 源码实证，非推测）：
#   1. 本仓 git remote = github.com/Encaron/linkdesk ⇒ electron-builder 自动推定
#      publish provider = github（仓里一个 publish 配置都没写，PublishManager.js:217-222）。
#   2. 不写 artifactName → NSIS 默认名 = `${productName} Setup ${version}.${ext}` =
#      "LinkDesk Setup 0.1.47.exe"（含空格）。
#   3. 空格不在 GitHub 允许的 [0-9A-Za-z._-] 内 ⇒ isSafeGithubName 判假 ⇒ electron-builder
#      只把空格换成连字符，得到 safeArtifactName = "LinkDesk-Setup-0.1.47.exe"
#      （platformPackager.js:690），并把它写进 latest.yml 的 path / files[].url
#      （updateInfoBuilder.js:100）。
#   4. 🔴 但磁盘上的文件仍叫 "LinkDesk Setup 0.1.47.exe"（不改名）——
#      ⇒ latest.yml 指着一个从不存在的文件。更新器读 latest.yml 的 path 去找 asset，
#        检查更新能成功、下载永远 404，报 asset-missing。
#
# 写成 ${name} 小写（package.json 的 name = linkdesk）之后，整串字符都落在
# [0-9A-Za-z._-] 内 ⇒ isSafeGithubName 判真 ⇒ safeArtifactName 返回 null ⇒
# latest.yml 不再改写 ⇒ 磁盘名 / latest.yml path / Release asset / 下载链接四处同名。
# ⚠️ 是 ${name} 不是 ${productName}——productName 是大写 L/D 的 LinkDesk，大小写在 URL 场景敏感。
# 门禁：scripts/assert-installer-name.mjs（已链进 electron:build 与 CI）。
artifactName: "${name}-setup-${version}.${ext}"

directories:
  # E6#15e 后定案（2026-09-06 用户拍板）：打包输出统一落仓库外 E:\linkdesk-build（相对父目录），
  # 消灭 E:\linkdesk 下 release/release2/release-15e 等散落产物 + 避开 Defender 深扫锁 default_app.asar。
  output: ../linkdesk-build
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - node_modules/**/*
  # E6#57.1a：产品身份三件套之 product.json——随包进 asar（product.ts 经 app.getAppPath() 读，
  # 07 更新 §四.1）。发布时由壳发布脚本写入版本/commit/date（E6#57.15a），dev 留占位。

# 🔥 E6#17a（#15d 消费切换相）：plugins/ 源码目录不再打包——resources/ 不含任何插件源码。
# 打包版插件唯一运行根 = userData（bundled-plugins 发货 zip → boot 自动装解压落 userData）。
# 语义收敛：resources = 只读发货夹；userData = 唯一可写运行根。dev 不变（app 根 = repo plugins/ 源码树）。
asar: true

extraResources:
  # E6#15c：内置插件 pre-bundle 独立化——随壳发货夹（boot 首启自动装 → userData；保留备份可恢复）。
  # dev 同夹（<repo>/bundled-plugins）——dev/prod 一致，boot 自动装同走 envService.bundledPluginsDir()。
  - from: bundled-plugins
    to: bundled-plugins
  - from: build/icon.ico
    to: icon.ico
  # E6#15e：LSP 语言服务器不再壳发货——pyright 随 python 插件自带（.linkdesk-plugin zip 内 node_modules/pyright，
  # boot 自动装落 userData）。壳注册处按插件根把 langDef.lsp.args 一次绝对化（electron/plugins/lsp-arg-resolve.ts）→
  # spawn 命中 userData 路径，无需 ASAR 外拷贝。E5#114d 临时 hack 删除（核心无知：壳不背语言工具）。

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

# 自动 rebuild 原生模块（serialport）以匹配 Electron 的 Node.js ABI
npmRebuild: true
