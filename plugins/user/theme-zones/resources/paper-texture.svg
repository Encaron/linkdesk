<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- E5.8#50.28 纸纹（⑬）——feTurbulence stitchTiles="stitch" 保证跨 96px 磁贴边界无缝 →
       background-repeat: repeat 平铺无接缝；feColorMatrix 把噪声映成暖墨色 alpha 抖动 = 纸面颗粒。
       纯函数资产，作者可换任意可平铺图。 -->
  <filter id="grain" x="0" y="0" width="96" height="96" filterUnits="userSpaceOnUse">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch" result="n"/>
    <feColorMatrix in="n" type="matrix"
      values="0 0 0 0 0.16
              0 0 0 0 0.14
              0 0 0 0 0.10
              0 0 0 0.45 0"/>
  </filter>
  <rect width="96" height="96" filter="url(#grain)"/>
</svg>
