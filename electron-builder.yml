# electron-builder 打包配置
#
# E1 步 7：替代 Tauri 的 tauri.conf.json。
#
# 🔴 件 3b（2026-10-02）：出包从「electron-builder 生成 NSIS 安装器」改为
#    「electron-builder 只出 **7z 载荷** ＋ 自绘引导器壳拼单文件」：
#      win.target = 7z  ⇒  `<产物目录>/linkdesk-setup-<ver>.7z`（= win-unpacked 整棵）
#      scripts/build-installer.mjs ⇒ 把它拼在 `build/installer/bootstrapper/out/bootstrapper.exe`
#      之后（中间 64 字节 marker）得到用户双击的 `linkdesk-setup-<ver>.exe`
#    ⇒ NSIS 全退场：安装界面、注册表写入、卸载器全部归引导器（见 04 `安装界面自绘/`）。
#    ⚠️ 因此本文件不再负责**安装器**行为（无 nsis 段），但 `artifactName` / `directories.output`
#      仍是**载荷名与产物目录的唯一真理源**——build-installer.mjs 的默认路径就是从这两处推的。
#
# 关键设计：
#   - 插件源码不进包（extraResources = 只读 bundled-plugins 发货夹 + icon）；
#     安装/卸载/运行根全在 userData（E6#15d 消费切换相 #17a）
#   - linkdesk:// 协议根据 app.isPackaged 切换路径前缀
#   - npmRebuild 自动处理 serialport 原生模块

appId: com.linkdesk.app
productName: LinkDesk
copyright: Copyright © 2026 LinkDesk

# 🔥 E6#42e —— 安装包文件名的唯一真理源。别删、别改 `${name}` 的写法。
#
# 为什么不写会出事（2026-09-11 读 electron-builder 26.15.3 源码实证，非推测）：
#   1. 本仓 git remote = github.com/Encaron/linkdesk ⇒ electron-builder 自动推定
#      publish provider = github（仓里一个 publish 配置都没写，PublishManager.js:217-222）。
#   2. 不写 artifactName → NSIS 默认名 = `${productName} Setup ${version}.${ext}` =
#      "LinkDesk Setup 0.1.47.exe"（含空格）。
#   3. 空格不在 GitHub 允许的 [0-9A-Za-z._-] 内 ⇒ isSafeGithubName 判假 ⇒ electron-builder
#      只把空格换成连字符，得到 safeArtifactName = "LinkDesk-Setup-0.1.47.exe"
#      （platformPackager.js:690），并把它写进 latest.yml 的 path / files[].url
#      （updateInfoBuilder.js:100）。
#   4. 🔴 但磁盘上的文件仍叫 "LinkDesk Setup 0.1.47.exe"（不改名）——
#      ⇒ latest.yml 指着一个从不存在的文件。更新器读 latest.yml 的 path 去找 asset，
#        检查更新能成功、下载永远 404，报 asset-missing。
#
# 写成 ${name} 小写（package.json 的 name = linkdesk）之后，整串字符都落在
# [0-9A-Za-z._-] 内 ⇒ isSafeGithubName 判真 ⇒ safeArtifactName 返回 null ⇒
# latest.yml 不再改写 ⇒ 磁盘名 / latest.yml path / Release asset / 下载链接四处同名。
# ⚠️ 是 ${name} 不是 ${productName}——productName 是大写 L/D 的 LinkDesk，大小写在 URL 场景敏感。
# 门禁：scripts/assert-installer-name.mjs（已链进 electron:build 与 CI）。
#
# 🔴 件 3b 订正（2026-10-02）——上面那套病根链**依然成立**，但**主体换了**：
#   现在 `artifactName` 命名的是**载荷 7z**（`linkdesk-setup-<ver>.7z`），改它不再直接改安装器的名字；
#   用户双击的那个 `linkdesk-setup-<ver>.exe` 由 `scripts/build-installer.mjs` 用**同一个形状**产出
#   （它的默认 `--out` 与这里是同一模板），名门禁 ② 拿**磁盘真值**对账、④ 拿**运行时消费方**对账。
#   ⇒ 「安全名翻译」那条老路（electron-builder 把空格换连字符）随 NSIS 退场而**结构性消失**；
#     保留 artifactName 是为了载荷名可预测（拼合脚本按它找输入），不是为了安装器名。
artifactName: "${name}-setup-${version}.${ext}"

directories:
  # E6#15e 后定案（2026-09-06 用户拍板）：打包输出统一落仓库外 E:\linkdesk-build（相对父目录），
  # 消灭 E:\linkdesk 下 release/release2/release-15e 等散落产物 + 避开 Defender 深扫锁 default_app.asar。
  output: ../linkdesk-build
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - node_modules/**/*
  - electron/product.json
  # 🔴 E6#57.15a① —— 上面那一行就是产品身份 product.json **实际随包进 asar 的条目**（不是这条注释）。
  # 路径必须与 electron/product.ts 的 productJsonPath() 逐段一致：app.getAppPath()/electron/product.json
  # ⇒ 打包后落在 asar 内 electron/product.json（**不是 asar 根**，别写成 product.json）。
  # 为什么这行不能少：缺了它 readFileSync 抛错被 catch 吞掉（product.ts:76），product.json 的字段
  # 全部退回兜底值 —— updateUrl 变空串（product.ts:56）⇒ 更新元数据腿整条失效，且**不报错**，
  # 靠人看产物永远看不出来。发布时由壳发布脚本覆写 version/commit/date（E6#57.15a），dev 留占位。

# 🔥 E6#17a（#15d 消费切换相）：plugins/ 源码目录不再打包——resources/ 不含任何插件源码。
# 打包版插件唯一运行根 = userData（bundled-plugins 发货 zip → boot 自动装解压落 userData）。
# 语义收敛：resources = 只读发货夹；userData = 唯一可写运行根。dev 不变（app 根 = repo plugins/ 源码树）。
asar: true

extraResources:
  # E6#15c：内置插件 pre-bundle 独立化——随壳发货夹（boot 首启自动装 → userData；保留备份可恢复）。
  # dev 同夹（<repo>/bundled-plugins）——dev/prod 一致，boot 自动装同走 envService.bundledPluginsDir()。
  - from: bundled-plugins
    to: bundled-plugins
  - from: build/icon.ico
    to: icon.ico
  # M3 `AI#16`（AI友好化-全自动操作/03-任务档案/M3-手册.md）：AI 操作手册随包发货——
  # `docs/07-AI操作手册/*.md` → `<resources>/ai-manual/*.md`（只换父目录，章节名与 `00-`/`01-`
  # 前缀保持原样 ⇒ 阅读顺序不变）。
  # 🔴 为什么必须**搬家**而不是原地留在 `docs/`：`docs/` 不进安装包（files 白名单里没有它，
  #    且它本来就不该整目录进包）。手册进包 = 一个**面向用户**的发货物，与源码树文档分开管。
  # 读取端 = `electron/services/ai-manual.ts` 的 `manualDir()`（dev 读源码树那份，打包读这里的落点，
  # 两处同名 `ai-manual` ⇒ 本文件的 `to` 与那个常量是**同一件事的两处声明**，改名须同改）。
  # 离线恒可读（纯本地文件，零网络）——这是本格的硬要求（档案风险条目：⛔ 别做成需要联网才能看）。
  - from: docs/07-AI操作手册
    to: ai-manual
  # M4 `AI#40`：linkdeskctl CLI 随包（`<resources>/linkdeskctl/`）——零第三方依赖，垫片用随包
  # Electron 以 node 模式跑（ELECTRON_RUN_AS_NODE，用户机器免装 node）。PATH 项（installer.nsh
  # 「添加到 PATH」，默认勾）加的是 $INSTDIR ⇒ 敲得到的 `linkdeskctl` = 安装根的 .cmd 垫片（extraFiles）。
  # filter（`AI#59` 起）：CLI 有了测试文件（lib/*.test.mjs）——只进仓、不进包（用户机器不需要测试，
  # 也不该躺一份 import vitest 的死文件）；随包只留运行时那几份 mjs/d.mts。
  - from: cli/linkdeskctl
    to: linkdeskctl
    filter:
      - "**/*"
      - "!**/*.test.mjs"
  # E6#15e：LSP 语言服务器不再壳发货——pyright 随 python 插件自带（.linkdesk-plugin zip 内 node_modules/pyright，
  # boot 自动装落 userData）。壳注册处按插件根把 langDef.lsp.args 一次绝对化（electron/plugins/lsp-arg-resolve.ts）→
  # spawn 命中 userData 路径，无需 ASAR 外拷贝。E5#114d 临时 hack 删除（核心无知：壳不背语言工具）。

# M4 `AI#40` / `AI#58`：**两个**垫片进安装根（extraFiles 相对 INSTDIR；PATH 加的就是 $INSTDIR）。
#   ① linkdeskctl.cmd —— cmd 系壳（cmd.exe / PowerShell）靠 PATHEXT 发现（其中文注释曾把启动行读坏，AI#57）；
#   ② linkdeskctl     —— POSIX 壳（Git Bash / MSYS2 / Cygwin）**不看 PATHEXT**，只能靠「无扩展名 ＋ shebang」。
# 两种壳的发现机制不相交 ⇒ 同一件事的两份实现；启动配方（随包 Electron 以 node 模式跑
# resources/linkdeskctl）与打包声明必须逐字对齐，由 scripts/check-cli-shims.mjs 机械把关。
extraFiles:
  - from: build/linkdeskctl.cmd
    to: linkdeskctl.cmd
  - from: build/linkdeskctl
    to: linkdeskctl

win:
  icon: build/icon.ico # 04：显式声明（此前靠 build/ 约定目录兜底——挪目录/加平台会静默丢图标）
  target:
    # 🔴 件 3b：只有 7z——出的是**载荷**，安装器由引导器壳拼成（见文件头）。
    #    7z 的 `win-unpacked/` 照常产出（应用 asar 在里面，check-packaging-files ②③ 判它）。
    - target: 7z
      arch: [x64]

# 🔴 件 3b：`nsis:` 段已删除（NSIS 全退场）。
#   它原先声明的 three 项（oneClick:false / allowToChangeInstallationDirectory:true /
#   createDesktopShortcut:true）在自绘安装界面里各自有对应实现：
#     · 非一键 + 可选安装目录 ⇒ 引导器主屏的路径行（含行内校验）
#     · 桌面快捷方式          ⇒ 引导器安装段的「自定义选项」勾选（默认勾）
#   ⚠️ `build/installer.nsh` 文件**暂不删**（用户定的规矩：件 3c 实机清单过之前留着当后路）。

# 自动 rebuild 原生模块（serialport）以匹配 Electron 的 Node.js ABI
npmRebuild: true
