<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" fill="none">
  <!-- ============================================================
       settings 封面「设置的窗」   [skill: ui-ux-pro-max · A 家族]
       理念：设置插件 = 整个软件的驾驶舱。画「一个开着设置页的窗」——
       顶部搜索即过滤，左列分组导航，右侧每行名字在左、控件在右
       （字号步进器 / 深浅色开关 / 强调色板 / 字族下拉 / 主题卡片），
       与真实 @linkdesk/ui 控件一一对应。左下浮标 = 齿轮。
       资产独立 SVG：颜色自含（封面美术不受壳主题 token 约束）。
       ============================================================ -->
  <defs>
    <radialGradient id="st_bg" cx="0.5" cy="0.42" r="0.9">
      <stop offset="0" stop-color="#171a28"/>
      <stop offset="0.55" stop-color="#0f111c"/>
      <stop offset="1" stop-color="#08090f"/>
    </radialGradient>
    <radialGradient id="st_glowTL" cx="0.15" cy="0.07" r="0.8">
      <stop offset="0" stop-color="#7c8cff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7c8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="st_glowBR" cx="0.97" cy="1.05" r="0.85">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="st_head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#191d2e"/>
      <stop offset="1" stop-color="#121524"/>
    </linearGradient>
    <linearGradient id="st_body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d101b"/>
      <stop offset="1" stop-color="#0a0d16"/>
    </linearGradient>
    <linearGradient id="st_rowsel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c8cff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#7c8cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="st_themeSel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2136"/>
      <stop offset="1" stop-color="#131829"/>
    </linearGradient>
    <linearGradient id="st_status" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c8cff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#7c8cff" stop-opacity="0.015"/>
    </linearGradient>
    <filter id="st_shadow" x="-30%" y="-40%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <pattern id="st_grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 H 0 V 44" stroke="#cdd5ff" stroke-opacity="0.02"/>
    </pattern>
  </defs>

  <!-- 底：暗靛台面（网格 + 双环境光） -->
  <rect width="640" height="640" fill="url(#st_bg)"/>
  <rect width="640" height="640" fill="url(#st_glowTL)"/>
  <rect width="640" height="640" fill="url(#st_glowBR)"/>
  <rect width="640" height="640" fill="url(#st_grid)"/>

  <!-- 左下浮标：齿轮 -->
  <g transform="translate(92 582)" fill="#8ca3d8" fill-opacity="0.2">
    <g>
      <rect x="-2.6" y="-27" width="5.2" height="11" rx="1.4"/>
      <rect x="-2.6" y="16" width="5.2" height="11" rx="1.4"/>
      <rect x="-2.6" y="-27" width="5.2" height="11" rx="1.4" transform="rotate(45)"/>
      <rect x="-2.6" y="16" width="5.2" height="11" rx="1.4" transform="rotate(45)"/>
      <rect x="-2.6" y="-27" width="5.2" height="11" rx="1.4" transform="rotate(90)"/>
      <rect x="-2.6" y="16" width="5.2" height="11" rx="1.4" transform="rotate(90)"/>
      <rect x="-2.6" y="-27" width="5.2" height="11" rx="1.4" transform="rotate(135)"/>
      <rect x="-2.6" y="16" width="5.2" height="11" rx="1.4" transform="rotate(135)"/>
    </g>
    <circle r="21" stroke="#8ca3d8" stroke-width="6"/>
    <circle r="8.5" fill="#0a0d16" fill-opacity="1"/>
  </g>

  <!-- 窗口 -->
  <rect x="44" y="104" width="552" height="428" rx="20" fill="#000" opacity="0.5" filter="url(#st_shadow)"/>
  <rect x="44" y="104" width="552" height="428" rx="20" fill="#0d101b"/>
  <rect x="44" y="104" width="552" height="428" rx="20" stroke="#aeb9f5" stroke-opacity="0.13"/>
  <rect x="46.5" y="106.5" width="547" height="31" rx="15" fill="#aeb9f5" fill-opacity="0.02"/>

  <!-- 标题栏：窗钮 + 居中「设置 · 驾驶舱」 -->
  <circle cx="70" cy="122" r="5.5" fill="#ff5f57"/>
  <circle cx="87" cy="122" r="5.5" fill="#febc2e"/>
  <circle cx="104" cy="122" r="5.5" fill="#28c840"/>
  <text x="320" y="127" text-anchor="middle" font-family="'Microsoft YaHei UI', sans-serif" font-size="11.5" fill="#8a95bd" letter-spacing="4">设置 · 驾驶舱</text>

  <!-- tab 行：设置（active）｜键盘快捷键 -->
  <line x1="44" y1="138" x2="596" y2="138" stroke="#aeb9f5" stroke-opacity="0.06"/>
  <text x="64" y="160" font-family="'Microsoft YaHei UI', sans-serif" font-size="12.5" fill="#e6ecfb">设置</text>
  <rect x="64" y="166" width="26" height="2.2" fill="#7c8cff"/>
  <text x="118" y="160" font-family="'Microsoft YaHei UI', sans-serif" font-size="12" fill="#66719a">键盘快捷键</text>

  <!-- 搜索框 -->
  <rect x="66" y="180" width="508" height="28" rx="9" fill="#0f1422"/>
  <rect x="66" y="180" width="508" height="28" rx="9" stroke="#ffffff" stroke-opacity="0.09"/>
  <circle cx="85" cy="194" r="5.5" stroke="#8a95bd" stroke-width="1.6" fill="none"/>
  <line x1="90" y1="199" x2="94.5" y2="203.5" stroke="#8a95bd" stroke-width="1.6" stroke-linecap="round"/>
  <text x="102" y="198" font-family="'Microsoft YaHei UI', sans-serif" font-size="12" fill="#5d678e">搜索设置…（字号 / 主题 / 快捷键）</text>
  <rect x="528" y="185" width="38" height="18" rx="4" fill="#ffffff" fill-opacity="0.05"/>
  <text x="547" y="198" text-anchor="middle" font-family="Consolas, 'JetBrains Mono', monospace" font-size="9.5" fill="#8a95bd">Ctrl ,</text>

  <!-- 左列：分组导航 -->
  <line x1="210" y1="220" x2="210" y2="478" stroke="#aeb9f5" stroke-opacity="0.05"/>
  <text x="74" y="244" font-family="'Microsoft YaHei UI', sans-serif" font-size="10" fill="#5d678e" letter-spacing="1.5">分组</text>
  <g font-family="'Microsoft YaHei UI', sans-serif" font-size="12.5">
    <rect x="66" y="256" width="128" height="28" rx="7" fill="url(#st_rowsel)"/>
    <rect x="66" y="256" width="2.5" height="28" rx="1.25" fill="#7c8cff"/>
    <text x="82" y="275" fill="#e6ecfb">外观</text>
    <text x="84" y="320" fill="#8a95bd">字体</text>
    <text x="84" y="358" fill="#8a95bd">语言</text>
    <text x="84" y="396" fill="#8a95bd">快捷键</text>
    <text x="84" y="434" fill="#8a95bd">插件</text>
  </g>

  <!-- 右列：设置行（名字在左 · 控件在右） -->
  <g font-family="'Microsoft YaHei UI', sans-serif">
    <!-- 行1：界面字号 + 步进器 -->
    <text x="230" y="266" font-size="12.5" fill="#dbe2f2">界面字号</text>
    <rect x="506" y="254" width="22" height="22" rx="6" fill="#ffffff" fill-opacity="0.06"/>
    <path d="M 512 265 h 10" stroke="#8a95bd" stroke-width="1.5" stroke-linecap="round"/>
    <text x="546" y="270" text-anchor="middle" font-family="Consolas, 'JetBrains Mono', monospace" font-size="13" fill="#dbe2f2">14</text>
    <rect x="562" y="254" width="22" height="22" rx="6" fill="#ffffff" fill-opacity="0.06"/>
    <path d="M 567 265 h 12 M 573 259 v 12" stroke="#8a95bd" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="230" y1="286" x2="580" y2="286" stroke="#aeb9f5" stroke-opacity="0.05"/>

    <!-- 行2：强调色 + 色板 -->
    <text x="230" y="316" font-size="12.5" fill="#dbe2f2">强调色</text>
    <text x="498" y="316" font-family="Consolas, 'JetBrains Mono', monospace" font-size="10.5" fill="#7b85ab">#7C8CFF</text>
    <circle cx="512" cy="311" r="6.5" fill="#e879f9" fill-opacity="0.7"/>
    <circle cx="531" cy="311" r="6.5" fill="#22d3ee"/>
    <circle cx="550" cy="311" r="6.5" fill="#ffffff" fill-opacity="0.08"/>
    <circle cx="569" cy="311" r="6.5" fill="#7c8cff"/>
    <circle cx="569" cy="311" r="9" fill="none" stroke="#7c8cff" stroke-width="1.4"/>
    <line x1="230" y1="338" x2="580" y2="338" stroke="#aeb9f5" stroke-opacity="0.05"/>

    <!-- 行3：跟随系统深浅色 + 开关 -->
    <text x="230" y="360" font-size="12.5" fill="#dbe2f2">跟随系统深浅色</text>
    <text x="230" y="375" font-size="10.5" fill="#5d678e">自动在浅色与深色外观之间切换</text>
    <rect x="534" y="344" width="46" height="24" rx="12" fill="#7c8cff"/>
    <circle cx="570" cy="356" r="9" fill="#fff"/>
    <line x1="230" y1="390" x2="580" y2="390" stroke="#aeb9f5" stroke-opacity="0.05"/>

    <!-- 行4：界面字族 + 下拉 -->
    <text x="230" y="412" font-size="12.5" fill="#dbe2f2">界面字族</text>
    <rect x="456" y="400" width="124" height="22" rx="6" fill="#ffffff" fill-opacity="0.05"/>
    <text x="466" y="415" font-family="Consolas, 'JetBrains Mono', monospace" font-size="10.5" fill="#b9c2dd">Segoe UI Variable</text>
    <path d="M 566 408 l 4.5 4.5 l 4.5 -4.5" stroke="#8a95bd" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="230" y1="430" x2="580" y2="430" stroke="#aeb9f5" stroke-opacity="0.05"/>
  </g>

  <!-- 主题配方：三张候选卡片（中选中） -->
  <text x="230" y="452" font-family="'Microsoft YaHei UI', sans-serif" font-size="11" fill="#aab4d6">主题配方 · 选一张当默认</text>

  <rect x="240" y="440" width="100" height="38" rx="8" fill="#0e111b"/>
  <rect x="240" y="440" width="100" height="38" rx="8" stroke="#aeb9f5" stroke-opacity="0.12"/>
  <rect x="250" y="448" width="80" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.09"/>
  <rect x="250" y="461" width="46" height="4.5" rx="2.2" fill="#7c8cff" fill-opacity="0.65"/>
  <rect x="302" y="461" width="28" height="4.5" rx="2.2" fill="#ffffff" fill-opacity="0.06"/>
  <rect x="250" y="470" width="30" height="4.5" rx="2.2" fill="#ffffff" fill-opacity="0.05"/>

  <rect x="350" y="440" width="100" height="38" rx="8" fill="url(#st_themeSel)"/>
  <rect x="349" y="439" width="102" height="40" rx="9" fill="none" stroke="#7c8cff" stroke-width="1.8"/>
  <path d="M 360 448 h 40" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4" stroke-linecap="round"/>
  <rect x="360" y="457" width="64" height="4" rx="2" fill="#7c8cff" fill-opacity="0.75"/>
  <rect x="360" y="466" width="40" height="4" rx="2" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="440" cy="472" r="6.5" fill="#7c8cff"/>
  <path d="M 437 472 l 2.2 2.2 l 4 -4" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="460" y="440" width="100" height="38" rx="8" fill="#101a16"/>
  <rect x="460" y="440" width="100" height="38" rx="8" stroke="#aeb9f5" stroke-opacity="0.12"/>
  <rect x="470" y="448" width="80" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.09"/>
  <rect x="470" y="461" width="46" height="4.5" rx="2.2" fill="#00E676" fill-opacity="0.8"/>
  <rect x="522" y="461" width="28" height="4.5" rx="2.2" fill="#ffffff" fill-opacity="0.06"/>
  <rect x="470" y="470" width="30" height="4.5" rx="2.2" fill="#ffffff" fill-opacity="0.05"/>

  <!-- 状态栏 -->
  <rect x="44" y="484" width="552" height="48" fill="url(#st_status)"/>
  <line x1="44" y1="484" x2="596" y2="484" stroke="#aeb9f5" stroke-opacity="0.07"/>
  <g font-family="'Microsoft YaHei UI', sans-serif" font-size="11" fill="#7b85ab">
    <text x="66" y="513">配置项由各插件贡献 · 搜索即达</text>
    <text x="430" y="513" font-family="Consolas, 'JetBrains Mono', monospace" font-size="10.5" fill="#8a95bd">Ctrl + ,</text>
    <text x="500" y="513">随时打开设置</text>
  </g>
</svg>
