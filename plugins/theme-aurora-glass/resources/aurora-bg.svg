<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.55" stop-color="#121A38"/>
      <stop offset="1" stop-color="#1A2344"/>
    </linearGradient>
    <linearGradient id="auroraTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="auroraIndigo" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4338CA" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#4338CA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="auroraViolet" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#EC4899" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="softWide" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="110"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#night)"/>

  <!-- 远处极光辉光层（大模糊） -->
  <ellipse cx="420" cy="320" rx="720" ry="260" fill="url(#auroraIndigo)" filter="url(#softWide)" opacity="0.8"/>
  <ellipse cx="1240" cy="280" rx="760" ry="240" fill="url(#auroraTeal)" filter="url(#softWide)" opacity="0.75"/>
  <ellipse cx="900" cy="520" rx="800" ry="300" fill="url(#auroraViolet)" filter="url(#softWide)" opacity="0.6"/>

  <!-- 极光亮带（中模糊，二次叠层加深度） -->
  <ellipse cx="300" cy="300" rx="620" ry="150" fill="url(#auroraIndigo)" filter="url(#soft)" opacity="0.85" transform="rotate(-12 300 300)"/>
  <ellipse cx="1330" cy="250" rx="660" ry="140" fill="url(#auroraTeal)" filter="url(#soft)" opacity="0.8" transform="rotate(14 1330 250)"/>
  <ellipse cx="1050" cy="470" rx="560" ry="180" fill="url(#auroraViolet)" filter="url(#soft)" opacity="0.7" transform="rotate(-8 1050 470)"/>

  <!-- 上缘柔光珠 -->
  <circle cx="520" cy="150" r="300" fill="url(#glowCyan)" filter="url(#soft)"/>
  <circle cx="1180" cy="120" r="260" fill="url(#glowPink)" filter="url(#soft)"/>

  <!-- 星点 -->
  <g fill="#FFFFFF">
    <circle cx="140" cy="90" r="1.6" opacity="0.9"/>
    <circle cx="420" cy="48" r="1.2" opacity="0.7"/>
    <circle cx="760" cy="70" r="1.4" opacity="0.8"/>
    <circle cx="1050" cy="40" r="1.1" opacity="0.6"/>
    <circle cx="1480" cy="80" r="1.5" opacity="0.85"/>
    <circle cx="90" cy="220" r="1.1" opacity="0.5"/>
    <circle cx="300" cy="170" r="1.0" opacity="0.45"/>
    <circle cx="620" cy="130" r="1.3" opacity="0.6"/>
    <circle cx="1380" cy="150" r="1.2" opacity="0.55"/>
    <circle cx="920" cy="105" r="1.0" opacity="0.5"/>
  </g>
</svg>
